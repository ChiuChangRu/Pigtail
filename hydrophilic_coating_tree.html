<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>親水塗層文獻資料庫｜動態樹枝圖</title>
<style>
:root{
  --bg:#f5f4f0; --card:#fff; --border:#dcd8d0; --text:#1c1c1a; --muted:#6b6860;
  --blue-bg:#e8f0fb;--blue-bd:#3478d4;--blue-tx:#0d4a9e;
  --green-bg:#e6f4ea;--green-bd:#2e9e58;--green-tx:#145c2e;
  --amber-bg:#fef3db;--amber-bd:#c9880a;--amber-tx:#7a4f00;
  --purple-bg:#ede9fb;--purple-bd:#7057d4;--purple-tx:#3a2185;
  --red-bg:#fceaea;--red-bd:#d94040;--red-tx:#8b1a1a;
  --teal-bg:#e2f4f1;--teal-bd:#1a9e8a;--teal-tx:#0a5c52;
  --gray-bg:#f0eee8;--gray-bd:#8a8880;--gray-tx:#3c3b38;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.6;padding:28px 20px 60px;max-width:1280px;margin:0 auto}
h1{font-size:23px;font-weight:600;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:18px}

/* 統計列 */
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:8px 14px;min-width:90px}
.stat .num{font-size:20px;font-weight:600}
.stat .lbl{font-size:11px;color:var(--muted)}

/* 控制列 */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center}
.controls input[type=text]{flex:1;min-width:200px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.filter-btn{padding:5px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);cursor:pointer;font-size:12px;color:var(--text);transition:all .15s}
.filter-btn:hover{background:var(--gray-bg)}
.filter-btn.active{background:var(--blue-tx);color:#fff;border-color:var(--blue-tx)}
.view-toggle{margin-left:auto;display:flex;gap:4px}

/* 區塊標題 */
.sec{margin-bottom:14px}
.sec-head{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin:24px 0 12px;padding-left:9px;border-left:3px solid var(--gray-bd)}

/* 卡片網格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 15px;border-left-width:4px;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card.blue{border-left-color:var(--blue-bd)}
.card.green{border-left-color:var(--green-bd)}
.card.amber{border-left-color:var(--amber-bd)}
.card.purple{border-left-color:var(--purple-bd)}
.card.red{border-left-color:var(--red-bd)}
.card.teal{border-left-color:var(--teal-bd)}
.card.gray{border-left-color:var(--gray-bd)}

.card-id{font-size:11px;font-weight:700;color:var(--muted)}
.card-type{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;margin-left:6px;font-weight:600}
.t-專利{background:var(--amber-bg);color:var(--amber-tx)}
.t-期刊論文{background:var(--blue-bg);color:var(--blue-tx)}
.t-綜述review{background:var(--purple-bg);color:var(--purple-tx)}
.t-商用產品{background:var(--green-bg);color:var(--green-tx)}
.t-會議論文{background:var(--gray-bg);color:var(--gray-tx)}
.card-title{font-size:14px;font-weight:600;margin:5px 0 4px;line-height:1.4}
.card-meta{font-size:12px;color:var(--muted);margin-bottom:7px}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--gray-bg);color:var(--gray-tx)}
.card-note{font-size:12px;color:var(--text);background:var(--gray-bg);border-radius:6px;padding:7px 9px;margin-bottom:7px;line-height:1.5}
.card-value{font-size:12px;color:var(--teal-tx);background:var(--teal-bg);border-radius:6px;padding:6px 9px;margin-bottom:8px}
.card-links{display:flex;flex-wrap:wrap;gap:5px}
.card-links a{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:5px;text-decoration:none;color:var(--blue-tx);background:#fff}
.card-links a:hover{background:var(--blue-bg)}

.access-badge{font-size:10px;padding:1px 6px;border-radius:4px;margin-left:4px}
.a-open{background:var(--green-bg);color:var(--green-tx)}
.a-patent{background:var(--amber-bg);color:var(--amber-tx)}
.a-paid{background:var(--gray-bg);color:var(--muted)}

.loading{text-align:center;padding:40px;color:var(--muted)}
.error{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red-tx);border-radius:10px;padding:16px;margin:20px 0}
.empty{text-align:center;padding:30px;color:var(--muted)}
.footer{margin-top:30px;font-size:11px;color:var(--muted);text-align:center}
</style>
</head>
<body>

<h1>親水塗層文獻資料庫</h1>
<p class="subtitle">動態讀取 papers.json｜TPU・穿刺針・導管・光固化・熱固化｜配方應用導向</p>

<div class="stats" id="stats"></div>

<div class="controls">
  <input type="text" id="search" placeholder="🔍 搜尋標題、標籤、摘要、價值說明...">
  <div class="view-toggle">
    <button class="filter-btn active" data-view="application" onclick="setView('application')">依應用分組</button>
    <button class="filter-btn" data-view="type" onclick="setView('type')">依類型分組</button>
    <button class="filter-btn" data-view="flat" onclick="setView('flat')">全部平鋪</button>
  </div>
</div>

<div class="controls" id="tagfilters"></div>

<div id="content"><div class="loading">載入文獻資料中...</div></div>

<div class="footer" id="footer"></div>

<script>
const COLOR_BY_TYPE = {"專利":"amber","期刊論文":"blue","綜述review":"purple","商用產品":"green","會議論文":"gray"};
const APP_GROUPS = [
  {key:"穿刺針", label:"穿刺針 / 活檢針 / 外科針", tags:["穿刺針","活檢針","外科針"]},
  {key:"TPU", label:"TPU 基材專屬", tags:["TPU"]},
  {key:"導管", label:"導管 / 導線 / Balloon", tags:["導管","導線guidewire","balloon"]},
  {key:"導尿管", label:"導尿管", tags:["導尿管"]},
  {key:"stent", label:"支架 Stent", tags:["stent"]},
  {key:"通用biomaterial", label:"通用 / 其他", tags:["通用biomaterial","stent"]}
];

let DATA = null, activeView = "application", activeTag = null, searchTerm = "";

async function load(){
  try{
    const r = await fetch('papers.json?_='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
    renderStats();
    renderTagFilters();
    render();
    renderFooter();
  }catch(e){
    document.getElementById('content').innerHTML =
      '<div class="error"><b>無法載入 papers.json</b><br>'+
      '請確認 papers.json 與本 HTML 在同一資料夾。<br>'+
      '若在本機直接開啟(file://)，瀏覽器會擋住讀取——請透過 GitHub Pages 或本機伺服器開啟。<br><br>'+
      '錯誤訊息：'+e.message+'</div>';
  }
}

function renderStats(){
  const p = DATA.papers;
  const patents = p.filter(x=>x.doc_type==='專利').length;
  const open = p.filter(x=>x.access&&(x.access.includes('開放')||x.access.includes('產品頁'))).length;
  const html = [
    ['總文獻', p.length],
    ['專利', patents+' ('+Math.round(patents*100/p.length)+'%)'],
    ['可取得全文', open],
    ['更新', DATA.meta.last_updated]
  ].map(([l,n])=>`<div class="stat"><div class="num">${n}</div><div class="lbl">${l}</div></div>`).join('');
  document.getElementById('stats').innerHTML = html;
}

function renderTagFilters(){
  const cure = ["UV光固化","熱固化","plasma","photografting"];
  const html = '<span style="font-size:12px;color:var(--muted)">固化/製程：</span>'+
    cure.map(t=>`<button class="filter-btn" data-tag="${t}" onclick="toggleTag('${t}')">${t}</button>`).join('')+
    `<button class="filter-btn" onclick="toggleTag(null)" id="clearTag" style="display:none">✕ 清除篩選</button>`;
  document.getElementById('tagfilters').innerHTML = html;
}

function toggleTag(t){
  activeTag = (activeTag===t)?null:t;
  document.querySelectorAll('#tagfilters .filter-btn[data-tag]').forEach(b=>{
    b.classList.toggle('active', b.dataset.tag===activeTag);
  });
  document.getElementById('clearTag').style.display = activeTag?'inline-block':'none';
  render();
}

function setView(v){
  activeView = v;
  document.querySelectorAll('.view-toggle .filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  render();
}

function matchesFilter(p){
  if(activeTag && !p.tags.includes(activeTag)) return false;
  if(searchTerm){
    const hay = (p.title+' '+(p.authors||'')+' '+p.tags.join(' ')+' '+(p.abstract_note||'')+' '+(p.value_to_project||'')+' '+(p.purpose||'')).toLowerCase();
    if(!hay.includes(searchTerm.toLowerCase())) return false;
  }
  return true;
}

function cardHTML(p){
  const color = COLOR_BY_TYPE[p.doc_type]||'gray';
  let accessCls='a-paid', accessTxt=p.access||'';
  if(p.access&&p.access.includes('開放')){accessCls='a-open';}
  else if(p.access&&p.access.includes('專利')){accessCls='a-patent';}
  else if(p.access&&p.access.includes('產品')){accessCls='a-open';}
  const tags = p.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  let links='';
  if(p.links){
    for(const [k,v] of Object.entries(p.links)){
      const label={doi:'DOI',patents:'專利',pubmed:'PubMed',fulltext:'全文',page:'頁面',article:'文章',ref:'來源',scholar:'Scholar',blog:'文章',news:'新聞',product:'產品頁',pdf:'PDF'}[k]||k;
      links+=`<a href="${v}" target="_blank" rel="noopener">${label}</a>`;
    }
  }
  return `<div class="card ${color}">
    <div><span class="card-id">${p.id}</span><span class="card-type t-${p.doc_type}">${p.doc_type}</span><span class="access-badge ${accessCls}">${accessTxt}</span></div>
    <div class="card-title">${p.title}</div>
    <div class="card-meta">${p.authors||'—'} · ${p.year||'—'} · ${p.venue||''}</div>
    <div class="card-tags">${tags}</div>
    ${p.abstract_note?`<div class="card-note">${p.abstract_note}</div>`:''}
    ${p.value_to_project?`<div class="card-value">✦ ${p.value_to_project}</div>`:''}
    <div class="card-links">${links}</div>
  </div>`;
}

function render(){
  searchTerm = document.getElementById('search').value;
  const filtered = DATA.papers.filter(matchesFilter);
  const el = document.getElementById('content');
  if(filtered.length===0){el.innerHTML='<div class="empty">沒有符合條件的文獻</div>';return;}

  if(activeView==='flat'){
    el.innerHTML = `<div class="grid">${filtered.map(cardHTML).join('')}</div>`;
    return;
  }
  if(activeView==='type'){
    const order=["專利","期刊論文","綜述review","商用產品","會議論文"];
    let html='';
    for(const t of order){
      const items=filtered.filter(p=>p.doc_type===t);
      if(items.length===0)continue;
      html+=`<div class="sec-head">${t}（${items.length}）</div><div class="grid">${items.map(cardHTML).join('')}</div>`;
    }
    el.innerHTML=html;
    return;
  }
  // application view
  let html='', used=new Set();
  for(const g of APP_GROUPS){
    const items=filtered.filter(p=>!used.has(p.id)&&g.tags.some(t=>p.tags.includes(t)));
    items.forEach(p=>used.add(p.id));
    if(items.length===0)continue;
    html+=`<div class="sec-head">${g.label}（${items.length}）</div><div class="grid">${items.map(cardHTML).join('')}</div>`;
  }
  const rest=filtered.filter(p=>!used.has(p.id));
  if(rest.length) html+=`<div class="sec-head">其他（${rest.length}）</div><div class="grid">${rest.map(cardHTML).join('')}</div>`;
  el.innerHTML=html;
}

function renderFooter(){
  document.getElementById('footer').innerHTML =
    `資料來源：公開文獻、MDPI Open Access、USPTO/Google Patents 全文、商用產品頁｜共 ${DATA.papers.length} 篇｜`+
    `本頁自動讀取同資料夾的 papers.json，新增文獻只需編輯該檔`;
}

document.getElementById('search').addEventListener('input', render);
load();
</script>
</body>
</html>
