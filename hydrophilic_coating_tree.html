<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>親水塗層文獻資料庫｜多維篩選</title>
<style>
:root{
  --bg:#f4f3ef;--card:#fff;--border:#dcd8d0;--text:#1c1c1a;--muted:#6b6860;--accent:#0d4a9e;
  --blue-bg:#e8f0fb;--blue-tx:#0d4a9e;--green-bg:#e6f4ea;--green-tx:#145c2e;
  --amber-bg:#fef3db;--amber-tx:#7a4f00;--purple-bg:#ede9fb;--purple-tx:#3a2185;
  --teal-bg:#e2f4f1;--teal-tx:#0a5c52;--red-bg:#fceaea;--red-tx:#8b1a1a;--gray-bg:#efede7;--gray-tx:#3c3b38;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:14px;line-height:1.6}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.sidebar{position:static!important;height:auto!important}}

/* 側邊欄 */
.sidebar{background:var(--card);border-right:1px solid var(--border);padding:20px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h2{font-size:16px;font-weight:600;margin-bottom:2px}
.sidebar .sub{font-size:11px;color:var(--muted);margin-bottom:16px}
.facet-group{margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:14px}
.facet-group:last-child{border-bottom:none}
.facet-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.facet-title .arrow{font-size:10px;color:var(--muted);transition:transform .2s}
.facet-title.collapsed .arrow{transform:rotate(-90deg)}
.facet-opts{display:flex;flex-direction:column;gap:5px}
.facet-opts.hidden{display:none}
.opt{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer;padding:2px 4px;border-radius:5px}
.opt:hover{background:var(--gray-bg)}
.opt input{cursor:pointer;width:15px;height:15px;accent-color:var(--accent)}
.opt .cnt{margin-left:auto;font-size:11px;color:var(--muted);background:var(--gray-bg);padding:0 6px;border-radius:999px;min-width:20px;text-align:center}
.opt.disabled{opacity:.38;cursor:not-allowed}
.clear-all{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;font-size:12px;margin-bottom:14px;color:var(--red-tx)}
.clear-all:hover{background:var(--red-bg)}

/* 主區 */
.main{padding:22px 26px 60px}
.head-row{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px}
h1{font-size:22px;font-weight:600}
.count-info{font-size:13px;color:var(--muted)}
.count-info b{color:var(--accent);font-size:16px}
.search{width:100%;padding:9px 13px;border:1px solid var(--border);border-radius:9px;font-size:14px;margin:12px 0 6px}
.active-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:4px}
.chip{font-size:11px;padding:3px 9px 3px 11px;border-radius:999px;background:var(--blue-bg);color:var(--blue-tx);display:flex;align-items:center;gap:6px}
.chip b{cursor:pointer;font-size:13px;line-height:1}
.sort-row{display:flex;gap:6px;align-items:center;margin-bottom:14px;font-size:12px;color:var(--muted)}
.sort-row select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px}

/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px 15px;border-left-width:4px}
.card.amber{border-left-color:#c9880a}.card.blue{border-left-color:#3478d4}
.card.purple{border-left-color:#7057d4}.card.green{border-left-color:#2e9e58}.card.gray{border-left-color:#8a8880}
.cid{font-size:11px;font-weight:700;color:var(--muted)}
.ctype{font-size:10px;padding:1px 7px;border-radius:999px;margin-left:6px;font-weight:600}
.tp-專利{background:var(--amber-bg);color:var(--amber-tx)}.tp-期刊論文{background:var(--blue-bg);color:var(--blue-tx)}
.tp-綜述review{background:var(--purple-bg);color:var(--purple-tx)}.tp-商用產品{background:var(--green-bg);color:var(--green-tx)}.tp-會議論文{background:var(--gray-bg);color:var(--gray-tx)}
.ctitle{font-size:14px;font-weight:600;margin:5px 0 4px;line-height:1.4}
.cmeta{font-size:12px;color:var(--muted);margin-bottom:8px}
.cfacets{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.fc{font-size:10px;padding:1px 7px;border-radius:5px;background:var(--gray-bg);color:var(--gray-tx)}
.fc.hl{background:var(--blue-bg);color:var(--blue-tx);font-weight:600}
.cnote{font-size:12px;background:var(--gray-bg);border-radius:6px;padding:7px 9px;margin-bottom:7px;line-height:1.5}
.cval{font-size:12px;color:var(--teal-tx);background:var(--teal-bg);border-radius:6px;padding:6px 9px;margin-bottom:8px}
.clinks{display:flex;flex-wrap:wrap;gap:5px}
.clinks a{font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:5px;text-decoration:none;color:var(--blue-tx);background:#fff}
.clinks a:hover{background:var(--blue-bg)}
.loading,.empty{text-align:center;padding:50px;color:var(--muted)}
.error{background:var(--red-bg);border:1px solid #d94040;color:var(--red-tx);border-radius:10px;padding:16px;margin:20px}
</style>
</head>
<body>
<div class="wrap">
  <aside class="sidebar">
    <h2>篩選器</h2>
    <div class="sub">多條件交集 (AND)</div>
    <button class="clear-all" onclick="clearAll()">✕ 清除全部篩選</button>
    <div id="facets"></div>
  </aside>
  <main class="main">
    <div class="head-row">
      <h1>親水塗層文獻資料庫</h1>
      <div class="count-info"><b id="shownCount">—</b> / <span id="totalCount">—</span> 篇</div>
    </div>
    <input type="text" class="search" id="search" placeholder="🔍 關鍵字搜尋：標題、摘要、價值說明、廠商...">
    <div class="active-chips" id="chips"></div>
    <div class="sort-row">
      排序：
      <select id="sort" onchange="render()">
        <option value="id">編號</option>
        <option value="year-desc">年份(新→舊)</option>
        <option value="year-asc">年份(舊→新)</option>
        <option value="type">類型</option>
      </select>
    </div>
    <div id="content"><div class="loading">載入中...</div></div>
  </main>
</div>

<script>
const FACET_ORDER = ["application","substrate","cure","polymer","photoinitiator","primer","function","layers","has_data","doc_type","access"];
const FACET_LABEL = {application:"應用部位",substrate:"基材種類",cure:"固化/成膜方式",polymer:"親水主成分",photoinitiator:"光起始劑",primer:"Primer策略",function:"功能性",layers:"塗層層數",has_data:"含量化數據",doc_type:"文獻類型",access:"取得方式"};
const TYPE_COLOR = {"專利":"amber","期刊論文":"blue","綜述review":"purple","商用產品":"green","會議論文":"gray"};

let DATA=null, selected={}, searchTerm="", collapsed={};

function getFacetVal(p, facet){
  if(facet==="doc_type") return [p.doc_type];
  if(facet==="access") return [p.access||"未標"];
  const v = p.facets ? p.facets[facet] : null;
  if(v==null) return [];
  return Array.isArray(v)? v : [v];
}

async function load(){
  try{
    const r = await fetch('papers.json?_='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA = await r.json();
    FACET_ORDER.forEach(f=>selected[f]=new Set());
    document.getElementById('totalCount').textContent = DATA.papers.length;
    buildFacets(); render();
  }catch(e){
    document.getElementById('content').innerHTML='<div class="error"><b>無法載入 papers.json</b><br>請確認與本檔同資料夾，且透過 GitHub Pages 或本機伺服器開啟(非 file://)。<br>錯誤：'+e.message+'</div>';
  }
}

// 計算某facet某選項在「其他條件已篩選」下的可用數量
function countFor(facet, opt){
  return DATA.papers.filter(p=>{
    if(!passSearch(p)) return false;
    for(const f of FACET_ORDER){
      if(f===facet) continue;
      if(selected[f].size===0) continue;
      const vals=getFacetVal(p,f);
      if(![...selected[f]].every(s=>vals.includes(s))) return false; // AND within... 改OR within facet見下
    }
    return getFacetVal(p,facet).includes(opt);
  }).length;
}

function buildFacets(){
  const el=document.getElementById('facets');
  let html='';
  for(const facet of FACET_ORDER){
    const counts={};
    DATA.papers.forEach(p=>getFacetVal(p,facet).forEach(v=>counts[v]=(counts[v]||0)+1));
    const opts=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
    if(opts.length===0) continue;
    const isCol=collapsed[facet];
    html+=`<div class="facet-group">
      <div class="facet-title ${isCol?'collapsed':''}" onclick="toggleCollapse('${facet}')">
        ${FACET_LABEL[facet]} <span class="arrow">▼</span>
      </div>
      <div class="facet-opts ${isCol?'hidden':''}" id="opts-${facet}">`;
    for(const o of opts){
      const checked=selected[facet].has(o)?'checked':'';
      html+=`<label class="opt" data-facet="${facet}" data-opt="${o}">
        <input type="checkbox" ${checked} onchange="toggleOpt('${facet}',this.dataset?'':'' )" data-f="${facet}" data-o="${o}">
        <span>${o}</span><span class="cnt" id="cnt-${facet}-${cssEsc(o)}">${counts[o]}</span>
      </label>`;
    }
    html+=`</div></div>`;
  }
  el.innerHTML=html;
  // 綁定
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change',()=>{toggleOpt(cb.dataset.f, cb.dataset.o);});
  });
}
function cssEsc(s){return s.replace(/[^a-zA-Z0-9]/g,'_');}

function toggleCollapse(f){collapsed[f]=!collapsed[f];buildFacets();}
function toggleOpt(facet,opt){
  if(selected[facet].has(opt)) selected[facet].delete(opt);
  else selected[facet].add(opt);
  render(); updateCounts();
}
function clearAll(){FACET_ORDER.forEach(f=>selected[f]=new Set());searchTerm='';document.getElementById('search').value='';buildFacets();render();}

function passSearch(p){
  if(!searchTerm) return true;
  const hay=(p.title+' '+(p.authors||'')+' '+(p.venue||'')+' '+p.tags.join(' ')+' '+(p.abstract_note||'')+' '+(p.value_to_project||'')+' '+(p.purpose||'')).toLowerCase();
  return hay.includes(searchTerm.toLowerCase());
}
// 篩選邏輯:不同facet間AND,同facet內OR
function passFilters(p){
  if(!passSearch(p)) return false;
  for(const f of FACET_ORDER){
    if(selected[f].size===0) continue;
    const vals=getFacetVal(p,f);
    if(![...selected[f]].some(s=>vals.includes(s))) return false; // OR within facet
  }
  return true;
}

function updateCounts(){
  // 動態更新每選項數量(在其他facet已選條件下)
  for(const facet of FACET_ORDER){
    const counts={};
    DATA.papers.forEach(p=>{
      // 套用除了本facet外的所有篩選
      if(!passSearch(p)) return;
      let ok=true;
      for(const f of FACET_ORDER){
        if(f===facet) continue;
        if(selected[f].size===0) continue;
        const vals=getFacetVal(p,f);
        if(![...selected[f]].some(s=>vals.includes(s))){ok=false;break;}
      }
      if(ok) getFacetVal(p,facet).forEach(v=>counts[v]=(counts[v]||0)+1);
    });
    document.querySelectorAll(`#opts-${facet} .opt`).forEach(opt=>{
      const o=opt.dataset.opt;
      const c=counts[o]||0;
      const cntEl=opt.querySelector('.cnt');
      if(cntEl) cntEl.textContent=c;
      opt.classList.toggle('disabled', c===0 && !selected[facet].has(o));
    });
  }
}

function renderChips(){
  const el=document.getElementById('chips');
  let html='';
  for(const f of FACET_ORDER){
    for(const o of selected[f]){
      html+=`<span class="chip">${o}<b onclick="toggleOpt('${f}','${o}')">×</b></span>`;
    }
  }
  if(searchTerm) html+=`<span class="chip">🔍 ${searchTerm}<b onclick="document.getElementById('search').value='';searchTerm='';render()">×</b></span>`;
  el.innerHTML=html;
}

function cardHTML(p){
  const color=TYPE_COLOR[p.doc_type]||'gray';
  const tags=p.tags.map(t=>`<span class="fc">${t}</span>`).join('');
  let links='';
  if(p.links) for(const[k,v]of Object.entries(p.links)){
    const lbl={doi:'DOI',patents:'專利',pubmed:'PubMed',fulltext:'全文',page:'頁面',article:'文章',ref:'來源',scholar:'Scholar',blog:'文章',news:'新聞',product:'產品',pdf:'PDF'}[k]||k;
    links+=`<a href="${v}" target="_blank" rel="noopener">${lbl}</a>`;
  }
  return `<div class="card ${color}">
    <div><span class="cid">${p.id}</span><span class="ctype tp-${p.doc_type}">${p.doc_type}</span> <span class="fc">${p.access||''}</span></div>
    <div class="ctitle">${p.title}</div>
    <div class="cmeta">${p.authors||'—'} · ${p.year||'—'} · ${p.venue||''}</div>
    <div class="cfacets">${tags}</div>
    ${p.abstract_note?`<div class="cnote">${p.abstract_note}</div>`:''}
    ${p.value_to_project?`<div class="cval">✦ ${p.value_to_project}</div>`:''}
    <div class="clinks">${links}</div>
  </div>`;
}

function render(){
  searchTerm=document.getElementById('search').value;
  let list=DATA.papers.filter(passFilters);
  const sort=document.getElementById('sort').value;
  if(sort==='year-desc') list.sort((a,b)=>(b.year||0)-(a.year||0));
  else if(sort==='year-asc') list.sort((a,b)=>(a.year||0)-(b.year||0));
  else if(sort==='type') list.sort((a,b)=>a.doc_type.localeCompare(b.doc_type));
  else list.sort((a,b)=>a.id.localeCompare(b.id));

  document.getElementById('shownCount').textContent=list.length;
  const el=document.getElementById('content');
  el.innerHTML = list.length? `<div class="grid">${list.map(cardHTML).join('')}</div>` : '<div class="empty">沒有符合所有條件的文獻，試著放寬篩選</div>';
  renderChips();
}

document.getElementById('search').addEventListener('input',()=>{render();updateCounts();});
load();
</script>
</body>
</html>
