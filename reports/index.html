<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hydrophilic Coating 文獻日報</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid #21262d;
    padding: 24px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo {
    width: 36px; height: 36px;
    background: #1f6feb;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: #fff;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #e6edf3;
  }

  header p {
    font-size: 13px;
    color: #7d8590;
    margin-top: 2px;
  }

  .stats-bar {
    background: #161b22;
    border-bottom: 1px solid #21262d;
    padding: 12px 32px;
    display: flex;
    gap: 32px;
  }

  .stat {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .stat-num {
    font-size: 20px;
    font-weight: 600;
    color: #e6edf3;
  }

  .stat-label {
    font-size: 12px;
    color: #7d8590;
  }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: #7d8590;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .report-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 40px;
  }

  .report-card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    text-decoration: none;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
  }

  .report-card:hover {
    border-color: #388bfd;
    background: #1c2128;
  }

  .report-card.today {
    border-color: #1f6feb;
  }

  .date-badge {
    background: #21262d;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    color: #e6edf3;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .report-card.today .date-badge {
    background: #1f6feb;
    color: #fff;
  }

  .report-meta {
    flex: 1;
    min-width: 0;
  }

  .report-title {
    font-size: 14px;
    color: #e6edf3;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .report-sub {
    font-size: 12px;
    color: #7d8590;
    margin-top: 2px;
  }

  .tag-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 12px;
    background: #21262d;
    color: #7d8590;
    border: 1px solid #30363d;
  }

  .tag.high { background: #0d2a0d; color: #3fb950; border-color: #238636; }
  .tag.new  { background: #0a1628; color: #388bfd; border-color: #1f6feb; }

  .score-pill {
    font-size: 12px;
    font-weight: 600;
    color: #3fb950;
    background: #0d2a0d;
    border: 1px solid #238636;
    border-radius: 12px;
    padding: 2px 10px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .arrow {
    color: #484f58;
    font-size: 16px;
    flex-shrink: 0;
  }

  .empty {
    text-align: center;
    padding: 60px 0;
    color: #484f58;
    font-size: 14px;
  }

  footer {
    text-align: center;
    padding: 32px;
    font-size: 12px;
    color: #484f58;
    border-top: 1px solid #21262d;
  }

  @media (max-width: 600px) {
    header { padding: 16px; }
    .stats-bar { padding: 12px 16px; gap: 20px; }
    main { padding: 20px 16px; }
    .report-card { padding: 12px 14px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">HC</div>
  <div>
    <h1>Hydrophilic Coating 文獻日報</h1>
    <p>Bioteque R&amp;D · 自動更新 · PubMed + USPTO</p>
  </div>
</header>

<div class="stats-bar" id="stats-bar">
  <div class="stat"><span class="stat-num" id="total-reports">—</span><span class="stat-label">份報告</span></div>
  <div class="stat"><span class="stat-num" id="total-papers">—</span><span class="stat-label">篇文獻</span></div>
  <div class="stat"><span class="stat-num" id="last-update">—</span><span class="stat-label">最後更新</span></div>
</div>

<main>
  <div class="section-title">歷史報告</div>
  <div class="report-list" id="report-list">
    <div class="empty">載入中…</div>
  </div>
</main>

<footer>
  每日 08:00 自動更新 · GitHub Actions + Claude API ·
  <a href="https://github.com/ChiuChangRu/Pigtail" style="color:#388bfd;text-decoration:none;">查看原始碼</a>
</footer>

<script>
// 讀取 papers.json 取得統計資料
async function loadStats() {
  try {
    const r = await fetch('../data/papers.json');
    const papers = await r.json();
    document.getElementById('total-papers').textContent = papers.length;
  } catch(e) {
    document.getElementById('total-papers').textContent = '—';
  }
}

// 讀取 manifest.json（由 GitHub Actions 自動產生）
async function loadReports() {
  const list = document.getElementById('report-list');

  try {
    const r = await fetch('manifest.json');
    if (!r.ok) throw new Error('no manifest');
    const reports = await r.json(); // [{date, total, high, tags}]

    if (!reports.length) {
      list.innerHTML = '<div class="empty">尚無報告</div>';
      return;
    }

    document.getElementById('total-reports').textContent = reports.length;
    const latest = reports[0].date;
    document.getElementById('last-update').textContent = latest;

    list.innerHTML = '';
    const today = new Date().toISOString().slice(0,10);

    reports.forEach(rep => {
      const isToday = rep.date === today;
      const card = document.createElement('a');
      card.className = 'report-card' + (isToday ? ' today' : '');
      card.href = rep.date + '.md';

      const tags = (rep.tags || []).slice(0, 4).map(t =>
        `<span class="tag">${t}</span>`
      ).join('');

      card.innerHTML = `
        <div class="date-badge">${rep.date}${isToday ? ' 今日' : ''}</div>
        <div class="report-meta">
          <div class="report-title">本日新增 ${rep.total} 篇${rep.high ? `，高相關 ${rep.high} 篇` : ''}</div>
          <div class="tag-row">
            ${rep.high ? `<span class="tag high">⭐ ${rep.high} 高相關</span>` : ''}
            ${rep.total ? `<span class="tag new">${rep.total} 篇新增</span>` : ''}
            ${tags}
          </div>
        </div>
        <span class="arrow">›</span>
      `;
      list.appendChild(card);
    });

  } catch(e) {
    // manifest 不存在時，fallback：直接嘗試今天的報告
    const today = new Date().toISOString().slice(0,10);
    list.innerHTML = `
      <a class="report-card today" href="${today}.md">
        <div class="date-badge">${today} 今日</div>
        <div class="report-meta">
          <div class="report-title">點此查看今日報告</div>
          <div class="report-sub">manifest.json 尚未產生，請手動觸發一次 Actions</div>
        </div>
        <span class="arrow">›</span>
      </a>`;
    document.getElementById('total-reports').textContent = '1';
    document.getElementById('last-update').textContent = today;
  }
}

loadStats();
loadReports();
</script>
</body>
</html>
